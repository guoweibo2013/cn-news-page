name: Update CN News Dashboard

on:
  schedule:
    # 每15分钟自动更新
    - cron: "*/15 * * * *"
    # 每天北京时间08:05生成日报 Issue
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore source and event history
        uses: actions/cache@v4
        with:
          path: .cache
          key: cn-news-state-${{ github.run_id }}
          restore-keys: |
            cn-news-state-

      - name: Generate dashboard
        run: |
          mkdir -p dist
          python3 cn-news-pulse/scripts/build_standalone.py \
            --output dist/index.html \
            --cache-dir .cache \
            --fail-if-empty
          if [ -d social ]; then
            cp -R social dist/
          fi
          test -s dist/index.html

      - name: Open daily digest issue
        if: github.event_name == 'schedule' && github.event.schedule == '5 0 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="国内时事日报 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          gh issue create --title "$title" --body-file dist/digest.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "新闻页面自动更新失败";
            const body = [
              "自动更新没有完成。上一版 GitHub Pages 页面会继续保留。",
              "",
              `任务：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `触发方式：${context.eventName}`,
              `分支：${context.ref}`,
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const existing = issues.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
